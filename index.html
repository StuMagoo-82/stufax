const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const f=document.getElementById("f"),msg=document.getElementById("msg"),go=document.getElementById("go");
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
(async()=>{
  let saved=null; try{saved=localStorage.getItem("stufax:key")}catch(e){}
  if(saved){
    try{ await show(await crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"])); return; }
    catch(e){ try{localStorage.removeItem("stufax:key")}catch(_){} }
  }
  f.hidden=false; document.getElementById("pw").focus();
})();
f.addEventListener("submit",async e=>{
  e.preventDefault(); go.disabled=true; msg.textContent=""; go.textContent="Unlocking…";
  try{
    const pw=document.getElementById("pw").value, te=new TextEncoder();
    const salt=new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode("stufax-salt:"+pw))).slice(0,16);
    const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
    if(document.getElementById("rem").checked){
      const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      try{localStorage.setItem("stufax:key",btoa(String.fromCharCode(...raw)))}catch(_){}
    }
    await show(key);
  }catch(err){
    msg.textContent="That password didn't work. Try again."; go.disabled=false; go.textContent="Unlock";
  }
});
</script>
